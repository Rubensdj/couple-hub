<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar • Couple Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #262626;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .main-card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    padding: 40px;
    width: 100%;
    max-width: 350px;
    text-align: center;
  }
  .logo {
    margin-bottom: 36px;
  }
  .logo svg { width: 175px; height: 51px; }
  .form-group { margin-bottom: 6px; text-align: left; }
  .form-group label { display: none; }
  .form-group input {
    width: 100%;
    padding: 14px 16px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    font-size: 16px;
    color: #262626;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .form-group input:focus {
    border-color: #bdbdbd;
    background: #fff;
  }
  .form-group input::placeholder { color: #8e8e8e; }
  .btn-login {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 4px;
    background: #0095f6;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-login:hover { background: #0077cc; }
  .btn-login:disabled { background: #b0d9f5; cursor: not-allowed; }
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #8e8e8e;
    font-size: 13px;
    font-weight: 600;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dbdbdb;
  }
  .divider span { padding: 0 16px; }
  .btn-facebook {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #385185;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .btn-facebook:hover { color: #2d4373; }
  .btn-facebook svg { width: 18px; height: 18px; }
  .forgot-link {
    display: block;
    margin-top: 16px;
    color: #00376b;
    font-size: 14px;
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
  .mensagem {
    margin: 12px 0;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .mensagem:not(:empty) { display: block; }
  .mensagem.erro { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .mensagem.sucesso { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .signup-card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    padding: 20px;
    margin-top: 16px;
    font-size: 14px;
    color: #262626;
  }
  .signup-card a {
    color: #0095f6;
    font-weight: 600;
    text-decoration: none;
  }
  .signup-card a:hover { text-decoration: underline; }
  .app-links {
    margin-top: 28px;
    text-align: center;
  }
  .app-links p { font-size: 14px; color: #8e8e8e; margin-bottom: 16px; }
  .app-buttons { display: flex; justify-content: center; gap: 12px; }
  .app-buttons img { height: 40px; }
  footer { padding: 20px; text-align: center; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 16px; }
  .footer-links a { color: #8e8e8e; text-decoration: none; font-size: 12px; }
  .footer-links a:hover { text-decoration: underline; }
  .footer-copyright { color: #8e8e8e; font-size: 12px; }
  @media (max-width: 400px) {
    .main-card { padding: 32px 24px; }
    .logo svg { width: 140px; height: 40px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="main-card">
    <div class="logo">
      <svg viewBox="0 0 175 51" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.5 0C7.8475 0 0 7.8475 0 17.5V33.5C0 43.1525 7.8475 51 17.5 51H157.5C167.153 51 175 43.1525 175 33.5V17.5C175 7.8475 167.153 0 157.5 0H17.5Z" stroke="#262626" stroke-width="2"/>
        <ellipse cx="87.5" cy="25.5" rx="14.5" ry="14.5" stroke="#262626" stroke-width="2"/>
        <circle cx="129.5" cy="13.5" r="4.5" fill="#262626"/>
      </svg>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="email">Telefone, nome de usuário ou email</label>
        <input type="text" id="email" name="email" placeholder="Telefone, nome de usuário ou email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
      </div>
      <div id="mensagem" class="mensagem"></div>
      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>

    <div class="divider"><span>OU</span></div>

    <button type="button" class="btn-facebook" id="btnFacebook">
      <svg viewBox="0 0 24 24" fill="#385185">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      Entrar com o Facebook
    </button>

    <a href="#" class="forgot-link">Esqueceu a senha?</a>
  </div>

  <div class="signup-card">
    Não tem conta? <a href="/cadastro">Cadastre-se</a>
  </div>

  <div class="app-links">
    <p>Baixe o app</p>
    <div class="app-buttons">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Google_Play_Store_badge_EN.svg" alt="Google Play">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/0e/App_Store_badge_en.svg" alt="App Store">
    </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="#">Meta</a>
    <a href="#">Sobre</a>
    <a href="#">Blog</a>
    <a href="#">Empregos</a>
    <a href="#">Ajuda</a>
    <a href="#">API</a>
    <a href="#">Privacidade</a>
    <a href="#">Termos</a>
    <a href="#">Melhores contas</a>
    <a href="#">Hashtags</a>
    <a href="#">Idioma</a>
  </div>
  <p class="footer-copyright">© 2024 Couple Hub — Direitos reservados: RUBENS PEREIRA FERNANDES</p>
</footer>

<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('mensagem');
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;

  btn.disabled = true;
  btn.textContent = 'Entrando...';
  msg.textContent = '';
  msg.className = 'mensagem';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();

    if (res.ok) {
      msg.className = 'mensagem sucesso';
      msg.textContent = 'Login realizado! Redirecionando...';
      setTimeout(() => window.location.href = '/app', 800);
    } else {
      msg.className = 'mensagem erro';
      msg.textContent = data.erro || 'Erro ao entrar';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch (err) {
    msg.className = 'mensagem erro';
    msg.textContent = 'Erro de conexão. Tente novamente.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
