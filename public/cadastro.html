<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Criar Conta</h1>
      <p class="subtitle">Preencha os dados para se cadastrar</p>

      <form id="formCadastro">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div id="mensagem" class="mensagem"></div>
        <button type="submit" class="btn btn-primary btn-full">Cadastrar</button>
      </form>

      <p class="link-text">Já tem conta? <a href="/login">Faça login</a></p>
    </div>
  </div>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value
      };

      const msg = document.getElementById('mensagem');

      try {
        const resposta = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        const resultado = await resposta.json();

        if (resposta.ok) {
          msg.className = 'mensagem sucesso';
          msg.textContent = resultado.mensagem;
          setTimeout(() => window.location.href = '/login', 1500);
        } else {
          msg.className = 'mensagem erro';
          msg.textContent = resultado.erro;
        }
      } catch (err) {
        msg.className = 'mensagem erro';
        msg.textContent = 'Erro ao conectar com o servidor.';
      }
    });
  </script>
</body>
</html>
